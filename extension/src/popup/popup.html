<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Insights 发布助手</title>
  <style>
    :root {
      --accent: #2563eb; --accent-strong: #1d4ed8;
      --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --field: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      margin: 0; width: 21rem; color: var(--ink);
      background: linear-gradient(165deg, #eef2ff, #f8fafc 60%);
    }
    .wrap { padding: .9rem 1rem 1rem; background: #fff;
            border: 1px solid var(--line); border-top: none; }
    .brand { display: flex; align-items: center; gap: .5rem; }
    .brand i {
      width: .55rem; height: .55rem; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 0 .2rem rgba(37, 99, 235, .14);
    }
    h1 { font-size: .95rem; margin: 0; }
    .sub { margin: .35rem 0 .8rem; font-size: .74rem; line-height: 1.5; color: var(--muted); }
    label { display: block; margin: .6rem 0 .25rem; font-size: .74rem; font-weight: 600; color: #334155; }
    input {
      width: 100%; padding: .48rem .6rem; font-size: .84rem; color: var(--ink);
      border: 1px solid var(--line); border-radius: 7px; background: var(--field);
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    input:focus {
      outline: none; background: #fff; border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .13);
    }
    input::placeholder { color: #94a3b8; }
    button {
      width: 100%; margin-top: .9rem; padding: .52rem; font-size: .86rem; font-weight: 600;
      color: #fff; background: var(--accent); border: none; border-radius: 7px; cursor: pointer;
      transition: background .15s, transform .06s;
    }
    button:hover { background: var(--accent-strong); }
    button:active { transform: translateY(1px); }
    .status {
      display: flex; align-items: flex-start; gap: .4rem; margin-top: .7rem;
      min-height: 1.2em; font-size: .76rem; font-weight: 600; color: var(--muted);
      word-break: break-all;
    }
    .status::before {
      content: ""; flex: none; width: .45rem; height: .45rem; margin-top: .28rem;
      border-radius: 50%; background: #94a3b8;
    }
    .status[data-state="ok"] { color: #15803d; }
    .status[data-state="ok"]::before { background: #22c55e; }
    .status[data-state="unauthorized"] { color: #b91c1c; }
    .status[data-state="unauthorized"]::before { background: #ef4444; }
    .status[data-state="unreachable"] { color: #b45309; }
    .status[data-state="unreachable"]::before { background: #f59e0b; }
    .login {
      display: flex; align-items: center; gap: .4rem; margin-top: .55rem;
      padding: .5rem .6rem; font-size: .76rem; color: #475569;
      background: var(--field); border: 1px solid var(--line); border-radius: 7px;
    }
    .login:empty { display: none; }
    .login::before {
      content: ""; flex: none; width: .45rem; height: .45rem; border-radius: 50%; background: #94a3b8;
    }
    .login[data-state="ok"]::before { background: #22c55e; }
    .login[data-state="no"]::before { background: #ef4444; }
    footer { margin-top: .7rem; padding-top: .6rem; border-top: 1px dashed var(--line); text-align: center; }
    footer a { font-size: .76rem; color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><i></i><h1>Insights 发布助手</h1></div>
    <p class="sub">把文章推进公众号草稿箱。配对一次即可。</p>

    <label for="server-url">服务器地址</label>
    <input id="server-url" type="url" placeholder="http://127.0.0.1:5001">

    <label for="pair-code">配对码</label>
    <input id="pair-code" inputmode="latin" maxlength="12" autocomplete="off"
           placeholder="发布队列页 →「配对浏览器扩展」生成">

    <button id="pair" type="button">一键配对</button>

    <div class="status" id="status"></div>
    <div class="login" id="weixin-login"></div>

    <footer><a href="#" id="open-options">打开完整设置 →</a></footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
