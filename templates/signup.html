<!doctype html>
<html lang="{{ 'zh-CN' if lang == 'zh' else 'en' }}" data-lang="{{ lang }}">
<head>
    <meta charset="utf-8">
    <title>Create account · Insights</title>
    <script src="{{ url_for('static', filename='i18n.js') }}"></script>
    <style>html[data-lang="zh"].i18n-loading body { visibility: hidden; }</style>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
        crossorigin="anonymous"
    >
    <style>
        body {
            background: #f9fafb;
            min-height: 100vh;
            color: #080a10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .auth-card {
            background: #fff;
            border: 1px solid #dee1e8;
            border-radius: 14px;
            padding: 2.25rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 12px 32px rgba(8, 10, 16, .08);
        }
        .auth-card h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin: 0 0 0.25rem;
        }
        .auth-card .subtitle {
            color: #5f636f;
            font-size: 0.9rem;
            margin: 0 0 1.5rem;
        }
        .auth-card .form-label {
            font-size: 0.8125rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #5f636f;
            margin-bottom: 0.25rem;
            font-weight: 600;
        }
        .auth-card .form-control {
            background: #fff;
            border: 1px solid #dee1e8;
            color: #080a10;
        }
        .auth-card .form-control:focus {
            background: #fff;
            border-color: #6d92ef;
            color: #080a10;
            box-shadow: 0 0 0 0.2rem rgba(20, 71, 230, 0.15);
        }
        .btn-brand {
            background: #1447e6;
            color: #fff;
            border: 0;
            font-weight: 500;
            width: 100%;
        }
        .btn-brand:hover { background: #2b59e8; color: #fff; }
        .btn-brand:focus { box-shadow: 0 0 0 0.2rem rgba(20, 71, 230, 0.25); color: #fff; }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
        }
        .brand img { height: 36px; }
        .brand span {
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .hint { font-size: 0.75rem; color: #5f636f; margin-top: 0.25rem; }
        .login-link a { color: #1447e6; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="brand">
            <img src="{{ url_for('static', filename='logo.svg') }}" alt="Insights">
            <span>Insights</span>
        </div>
        <h1>Create account</h1>
        <p class="subtitle">Pick a username and password to get started.</p>

        {% if error %}
        <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('signup') }}">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus
                       value="{{ username }}" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\-]+"
                       autocomplete="username">
                <div class="hint">3–32 characters. Letters, numbers, dot, underscore, or dash.</div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required
                       minlength="8" autocomplete="new-password">
                <div class="hint">At least 8 characters.</div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirm">Confirm password</label>
                <input type="password" id="confirm" name="confirm" class="form-control" required
                       minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-brand">Create account</button>
        </form>

        <p class="login-link text-center mt-3 mb-0" style="font-size: 0.875rem; color: #5f636f;">
            Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
        </p>
    </div>
</body>
</html>
